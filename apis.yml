description: 'Beam Therapeutics is a biotechnology company pioneering precision genetic
  medicines through base editing, a technology that makes precise, predictable, and
  efficient single-base changes to the genome without cutting the DNA double helix.
  The company is developing a portfolio of investigational base editing programs across
  hematology, hepatology, and other therapeutic areas, using multiple delivery modalities
  including electroporation, nonviral lipid nanoparticles, and viral vectors. Publicly
  traded on Nasdaq as BEAM, Beam was named a TIME100 Most Influential Company in 2026.
  This profile was surfaced as a portfolio company of gv and hongshan; it is a life-sciences
  company with no public developer/API surface at this time.'
